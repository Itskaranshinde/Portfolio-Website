<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Outfit", sans-serif;
      }
      body {
        background-color: #114ae4;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .contact-container {
        background-color: #fff;
        color: #000;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        max-width: 600px;
        width: 100%;
      }
      .contact-container h1 {
        text-align: center;
        margin-bottom: 20px;
        font-size: 2.2rem;
        color: #114ae4;
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        font-size: 0.95rem;
      }
      input[type="text"],
      input[type="email"],
      textarea {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 1rem;
        transition: 0.3s ease-in-out;
      }
      input[type="text"]:focus,
      input[type="email"]:focus,
      textarea:focus {
        border-color: #114ae4;
        outline: none;
        box-shadow: 0 0 5px rgba(17, 74, 228, 0.4);
      }
      textarea {
        resize: vertical;
        min-height: 120px;
      }
      button {
        width: 100%;
        padding: 14px;
        background-color: #114ae4;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        transition: background-color 0.3s;
        font-weight: 600;
      }
      button:hover {
        background-color: #0d3cc2;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="index.html">Home</a>
      <div class="dropdown">
        <button class="dropbtn">Projects</button>
        <div class="dropdown-content">
          <a href="asma.html">Asma</a>
          <a href="peter.html">Peter</a>
          <a href="karan.html">Karan</a>
          <a href="manjima.html">Manjima</a>
        </div>
      </div>
      <a href="contact.html">Contact</a>
    </nav>

    <div class="contact-container">
      <h1>Contact Us</h1>
      <form>
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" required />
        </div>
        <div class="form-group">
          <label for="email">Your Email</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="form-group">
          <label for="message">Your Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit">Send Message</button>
      </form>
    </div>
  </body>
</html>
